services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: spring-petclinic:1.0
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      MYSQL_URL: jdbc:mysql://mysql:3306/petclinic
      MYSQL_USER: petclinic
      MYSQL_PASS: ${MYSQL_PASSWORD:?请先设置MYSQL_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
      
  mysql:
    image: mysql:9.7
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?请先设置MYSQL_ROOT_PASSWORD}
      
      - MYSQL_USER=petclinic
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?请先设置MYSQL_PASSWORD}
      - MYSQL_DATABASE=petclinic
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql -h 127.0.0.1 -u petclinic -D petclinic -Nse 'SELECT 1' | grep -qx 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  


volumes:
  mysql_data:
  
